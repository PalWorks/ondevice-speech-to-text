# Settings for dictate-live (bin/dictate-live). Read on every F9 session start,
# so edits apply on the next press. Model file names are relative to ../models.
# Environment overrides: DICTATE_PREVIEW_MODEL, DICTATE_FINAL_ENGINE, DICTATE_FINAL_MODEL, DICTATE_LANG.
# Basic mode (bin/dictate) reads the final_* settings, prompt and language.

[dictate]
# Fast model that drives the live preview text (re-run every ~0.4 s).
preview_model = ggml-base.en.bin
# Engine whose output is what actually gets typed (both modes):
#   parakeet  NVIDIA Parakeet TDT 0.6b v3. About 1 to 2 s, strongest English
#             benchmark scores. English and European languages; ignores `prompt`.
#   whisper   final_model below with beam search. About 5 s with large-v3-turbo;
#             supports `prompt` and Indian languages.
# Compare both on your own voice with: dictate-compare (docs/ANALYSIS.md A5, A6).
final_engine = parakeet
parakeet_model = ggml-parakeet-tdt-0.6b-v3-q8_0.bin
final_model = ggml-large-v3-turbo-q5_0.bin
# Beam search width for whisper final passes (1 = greedy, fastest, least accurate).
final_beam_size = 5
# Vocabulary hint for whisper (preview and whisper final): names and terms you say often.
prompt = Claude, Anthropic, VS Code, WhatsApp, GitHub.
# Voice activity detection; drops silence so whisper does not invent text.
vad_model = ggml-silero-v5.1.2.bin
# en, or a whisper language code (hi, ta, ...) or auto. Anything other than en
# needs multilingual models, e.g. final_model = ggml-large-v3-turbo-q5_0.bin
language = en
threads = 4
# Sessions run as long as you talk (owner, 2026-11-16). They end by themselves after
# silence_stop_seconds without speech, or at max_seconds as a safety limit (4 hours).
max_seconds = 14400
silence_stop_seconds = 600
# Phrases: text is transcribed and inserted each time you pause for pause_ms.
# A phrase longer than max_phrase_seconds is cut at its quietest moment.
pause_ms = 700
max_phrase_seconds = 25
# Speech detection: a 100 ms chunk is speech when its loudness (RMS) is above both
# speech_min_rms and speech_ratio times the room's background level (measured
# continuously). If phrases don't end at pauses in a noisy room, raise speech_ratio;
# if quiet words get cut off, lower it.
speech_min_rms = 200
speech_ratio = 2.5
# Analytics: one JSON line per session in ../data/sessions.jsonl (local only).
log_sessions = true
# Also store the transcript text in that log. Off by owner's choice (2026-10-20):
# numbers only. Turning it on enables the word table in dictate-stats.
log_text = false
sounds = true
# Key name shown in the overlay hint; keep in sync with the XFCE shortcut (F9).
hotkey_label = F9
# Inserting text (added 2026-11-16).
# Keep the last backup_keep dictations in ../data/dictations.txt (mode 600, newest
# first) so text that never reached its window can be copied from there.
backup_text = true
backup_keep = 20
# In terminal apps, text this long or longer is pasted (Ctrl+Shift+V) instead of
# typed key by key; your previous clipboard text is put back afterwards.
terminal_paste_min_chars = 100
# Meetings (added 2026-11-16). When a second voice has spoken for meeting_min_seconds
# across at least 2 phrases, the session becomes a meeting: text goes to
# ../transcripts/<date time> meeting.md with speaker labels instead of the window.
# Needs the project venv (.venv, sherpa-onnx) and models/nemo_en_titanet_small.onnx.
meetings = true
meeting_min_seconds = 20
# Also record the computer's sound (the other people on Meet, Zoom, Teams) while a
# call is open: another app is recording the mic, or a call window is showing.
call_audio = true
